<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title th:text="${titulo}"></title>
<link href="/styles/style.css" rel="stylesheet" />
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
	crossorigin="anonymous">
</head>

<body>
	<main class="container">
		<div class="row justify-content-center gap-5">
			<section class="col-11 col-lg-8">
				<h1 th:text="${cabecera}"></h1>
				<div class="detalles-links">
					<a th:href="@{'/vehiculos'}" type="button" class="btn btn-warning">← Volver</a> <a
						th:href="@{'/vehiculos/form/' + ${vehiculo.id}}" type="button" class="btn btn-primary">Editar</a>
				</div>
			</section>

			<section class="col-11 col-lg-8">
				<ul class="list-group">
					<li class="list-group-item">
						<p>
							Id: <span th:text="${vehiculo.id}"></span>
						</p>
					</li>
					<li class="list-group-item">
						<p>
							Marca: <span th:text="${vehiculo.marca}"></span>
						</p>
					</li>
					<li class="list-group-item">
						<p>
							Modelo: <span th:text="${vehiculo.modelo}"></span>
						</p>
					</li>
					<li class="list-group-item">
						<p>
							Año: <span th:text="${vehiculo.anio}"></span>
						</p>
					</li>
				</ul>
			</section>
		</div>

	</main>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
		crossorigin="anonymous"></script>
</body>

</html>
